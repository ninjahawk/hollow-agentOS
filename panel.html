<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hollow AgentOS</title>
<style>
  :root {
    /* Deep navy/indigo palette inspired by premium SaaS dashboards */
    --bg-base: #14162b;
    --bg-elevated: #1c1f3b;
    --card-bg: linear-gradient(180deg, #262a4d 0%, #1e2240 100%);
    --card-border: rgba(255, 255, 255, 0.04);
    --card-highlight: rgba(255, 255, 255, 0.06);

    --text: #f1f3fb;
    --text-secondary: #9da3c8;
    --text-tertiary: #6b7299;

    --accent: #8b5cf6;
    --accent-glow: rgba(139, 92, 246, 0.35);
    --accent-soft: rgba(139, 92, 246, 0.12);
    --accent-hover: #a78bfa;

    --success: #34d399;
    --success-soft: rgba(52, 211, 153, 0.12);
    --success-glow: rgba(52, 211, 153, 0.4);

    --danger: #f43f5e;
    --danger-soft: rgba(244, 63, 94, 0.12);
    --danger-glow: rgba(244, 63, 94, 0.35);

    --warning: #fbbf24;
    --neutral-btn: #2c3056;
    --neutral-btn-hover: #353a66;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: radial-gradient(ellipse at top left, #1a1d3d 0%, var(--bg-base) 50%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Inter", "Segoe UI Variable", "Segoe UI", "Helvetica Neue",
                 system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }

  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 22px;
    gap: 14px;
  }

  /* ─────── Header ─────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }
  .title-block h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.025em;
    margin-bottom: 2px;
  }
  .title-block .subtitle {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--card-border);
    border-radius: 100px;
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-tertiary);
    transition: all 250ms ease;
  }
  .status.up .dot {
    background: var(--success);
    box-shadow: 0 0 0 3px var(--success-soft), 0 0 12px var(--success-glow);
  }
  .status.down .dot {
    background: var(--danger);
    box-shadow: 0 0 0 3px var(--danger-soft);
  }

  /* ─────── Cards ─────── */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: inset 0 1px 0 var(--card-highlight),
                0 1px 2px rgba(0, 0, 0, 0.2);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .card h2 {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .card-hint {
    font-size: 10.5px;
    color: var(--text-tertiary);
    letter-spacing: 0.02em;
  }

  /* ─────── Agent stat cards (top row) ─────── */
  .agent-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: inset 0 1px 0 var(--card-highlight),
                0 1px 2px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      var(--card-highlight) 50%,
      transparent 100%);
  }
  .stat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .stat-label {
    font-size: 10px;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .stat-name {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.suffering-low { color: var(--success); }
  .stat-value.suffering-mid { color: var(--warning); }
  .stat-value.suffering-high { color: var(--danger); }
  .stat-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10.5px;
    color: var(--text-tertiary);
    font-weight: 500;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .pill.active {
    background: var(--success-soft);
    color: var(--success);
  }
  .pill.suspended {
    background: var(--danger-soft);
    color: var(--danger);
  }
  .pill.unknown {
    background: rgba(255,255,255,0.05);
    color: var(--text-tertiary);
  }

  /* ─────── Buttons ─────── */
  .btn {
    padding: 7px 14px;
    background: var(--neutral-btn);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 150ms ease;
    user-select: none;
    box-shadow: inset 0 1px 0 var(--card-highlight);
  }
  .btn:hover {
    background: var(--neutral-btn-hover);
    border-color: rgba(255,255,255,0.08);
  }
  .btn:active { transform: translateY(0.5px); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2),
                0 0 12px var(--accent-glow);
  }
  .btn.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }
  .btn.danger {
    background: transparent;
    border-color: var(--danger);
    color: var(--danger);
    font-weight: 600;
  }
  .btn.danger:hover {
    background: var(--danger);
    color: white;
    box-shadow: 0 0 12px var(--danger-glow);
  }
  .btn.compact { padding: 5px 11px; font-size: 11px; }

  .button-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ─────── Message section ─────── */
  .msg-input {
    width: 100%;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    min-height: 64px;
    margin-bottom: 10px;
    outline: none;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .msg-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .msg-input::placeholder { color: var(--text-tertiary); }
  .msg-actions {
    display: flex;
    justify-content: flex-end;
  }

  /* ─────── Agent control rows ─────── */
  .agent-grid {
    display: grid;
    gap: 8px;
  }
  .agent-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--card-border);
    border-radius: 8px;
  }
  .agent-row .agent-name {
    font-size: 12px;
    font-weight: 500;
    text-transform: lowercase;
  }
  .agent-row .agent-meta {
    font-size: 10.5px;
    color: var(--text-tertiary);
    margin-left: 8px;
    font-weight: 500;
  }

  /* ─────── Output log ─────── */
  .output-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .output-log {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: "SF Mono", "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
    font-size: 11px;
    line-height: 1.6;
    color: var(--text);
    overflow-y: auto;
    white-space: pre-wrap;
    user-select: text;
  }
  .output-log .entry { margin-bottom: 8px; }
  .output-log .entry .ts {
    color: var(--text-tertiary);
    margin-right: 10px;
    font-size: 10.5px;
  }
  .output-log .entry.err { color: #fda4af; }
  .output-log .entry.dim { color: var(--text-secondary); }

  .clear-btn {
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    font-size: 10.5px;
    cursor: pointer;
    padding: 2px 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
    transition: color 150ms ease;
  }
  .clear-btn:hover { color: var(--text); }

  /* ─────── Scrollbar ─────── */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-block">
      <h1>Hollow AgentOS</h1>
      <div class="subtitle">CONTROL PANEL</div>
    </div>
    <div id="status" class="status">
      <div class="dot"></div>
      <div class="status-text">checking…</div>
    </div>
  </header>

  <!-- Agent stat cards -->
  <div class="agent-stats">
    <div class="stat-card" data-agent="scout">
      <div class="stat-header">
        <div>
          <div class="stat-label">scout</div>
          <div class="stat-name" id="name-scout">—</div>
        </div>
        <span class="pill unknown" id="pill-scout">—</span>
      </div>
      <div class="stat-value suffering-low" id="load-scout">—</div>
      <div class="stat-meta" id="info-scout">suffering load</div>
    </div>
    <div class="stat-card" data-agent="analyst">
      <div class="stat-header">
        <div>
          <div class="stat-label">analyst</div>
          <div class="stat-name" id="name-analyst">—</div>
        </div>
        <span class="pill unknown" id="pill-analyst">—</span>
      </div>
      <div class="stat-value suffering-low" id="load-analyst">—</div>
      <div class="stat-meta" id="info-analyst">suffering load</div>
    </div>
    <div class="stat-card" data-agent="builder">
      <div class="stat-header">
        <div>
          <div class="stat-label">builder</div>
          <div class="stat-name" id="name-builder">—</div>
        </div>
        <span class="pill unknown" id="pill-builder">—</span>
      </div>
      <div class="stat-value suffering-low" id="load-builder">—</div>
      <div class="stat-meta" id="info-builder">suffering load</div>
    </div>
  </div>

  <!-- System control -->
  <div class="card">
    <div class="card-header">
      <h2>System</h2>
    </div>
    <div class="button-row">
      <button class="btn" onclick="op('start')">Start</button>
      <button class="btn" onclick="op('stop')">Stop</button>
      <button class="btn" onclick="refreshAll()">Refresh</button>
      <button class="btn" onclick="op('open_monitor')">Open Monitor</button>
      <button class="btn" onclick="op('open_workspace')">Workspace</button>
    </div>
  </div>

  <!-- Send message -->
  <div class="card">
    <div class="card-header">
      <h2>Send Message</h2>
      <span class="card-hint">delivered next cycle</span>
    </div>
    <textarea id="msg" class="msg-input" placeholder="Type a host message…"></textarea>
    <div class="msg-actions">
      <button class="btn primary" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Per-agent control -->
  <div class="card">
    <div class="card-header">
      <h2>Agent Control</h2>
    </div>
    <div class="agent-grid">
      <div class="agent-row">
        <div><span class="agent-name">scout</span><span class="agent-meta" id="meta-scout"></span></div>
        <button class="btn compact" onclick="opArg('suspend','scout')">Suspend</button>
        <button class="btn compact" onclick="opArg('resume','scout')">Resume</button>
      </div>
      <div class="agent-row">
        <div><span class="agent-name">analyst</span><span class="agent-meta" id="meta-analyst"></span></div>
        <button class="btn compact" onclick="opArg('suspend','analyst')">Suspend</button>
        <button class="btn compact" onclick="opArg('resume','analyst')">Resume</button>
      </div>
      <div class="agent-row">
        <div><span class="agent-name">builder</span><span class="agent-meta" id="meta-builder"></span></div>
        <button class="btn compact" onclick="opArg('suspend','builder')">Suspend</button>
        <button class="btn compact" onclick="opArg('resume','builder')">Resume</button>
      </div>
    </div>
  </div>

  <!-- Destructive -->
  <div class="card">
    <div class="card-header">
      <h2>Destructive</h2>
      <span class="card-hint">stop the daemon first</span>
    </div>
    <div class="button-row">
      <button class="btn danger" onclick="confirmNuke()">Nuclear Reset</button>
    </div>
  </div>

  <!-- Output log -->
  <div class="card output-card">
    <div class="card-header">
      <h2>Output</h2>
      <button class="clear-btn" onclick="clearOutput()">CLEAR</button>
    </div>
    <div id="output" class="output-log"></div>
  </div>
</div>

<script>
  const output = document.getElementById('output');
  const statusEl = document.getElementById('status');
  const statusText = statusEl.querySelector('.status-text');
  const AGENTS = ['scout', 'analyst', 'builder'];

  function ts() {
    return new Date().toLocaleTimeString('en-US', { hour12: false });
  }

  function log(text, cls = 'ok') {
    const e = document.createElement('div');
    e.className = 'entry ' + cls;
    const tsSpan = document.createElement('span');
    tsSpan.className = 'ts';
    tsSpan.textContent = ts();
    e.appendChild(tsSpan);
    const txt = document.createElement('span');
    txt.textContent = text;
    e.appendChild(txt);
    output.appendChild(e);
    output.scrollTop = output.scrollHeight;
  }

  function clearOutput() { output.innerHTML = ''; }

  async function op(name) {
    try {
      const result = await window.pywebview.api[name]();
      log(result, 'ok');
      if (name === 'status') updateStatsFromText(result);
    } catch (e) {
      log('error: ' + e, 'err');
    }
  }

  async function opArg(name, arg) {
    try {
      const result = await window.pywebview.api[name](arg);
      log(result, 'ok');
      setTimeout(refreshAll, 500);
    } catch (e) {
      log('error: ' + e, 'err');
    }
  }

  async function sendMessage() {
    const ta = document.getElementById('msg');
    const text = ta.value.trim();
    if (!text) { log('empty message', 'dim'); return; }
    try {
      const result = await window.pywebview.api.send_message(text);
      log(result, 'ok');
      ta.value = '';
    } catch (e) {
      log('error: ' + e, 'err');
    }
  }

  async function confirmNuke() {
    log('confirm: nuclear reset will wipe workspace, tools, profiles, suffering, and goals (names preserved). click again within 5s to confirm.', 'dim');
    if (window._nukeArmed) {
      window._nukeArmed = false;
      log('running nuclear reset…', 'dim');
      try {
        const result = await window.pywebview.api.nuke();
        log(result, 'ok');
        setTimeout(refreshAll, 800);
      } catch (e) { log('error: ' + e, 'err'); }
      return;
    }
    window._nukeArmed = true;
    setTimeout(() => { window._nukeArmed = false; }, 5000);
  }

  function classifyLoad(load) {
    if (load < 0.35) return 'suffering-low';
    if (load < 0.75) return 'suffering-mid';
    return 'suffering-high';
  }

  function updateStatsFromText(text) {
    const lines = text.split('\n');
    let current = null;
    const data = {};
    for (const line of lines) {
      const m1 = line.match(/^(scout|analyst|builder)\s*\(([^)]+)\):/);
      if (m1) {
        current = m1[1];
        data[current] = { name: m1[2] };
        continue;
      }
      if (current) {
        const m2 = line.match(/status=(\S+)\s*\|\s*suffering=([\d.]+)\s*\|\s*ops=(\d+)\s*\|\s*questions=(\d+)/);
        if (m2) {
          data[current].status = m2[1];
          data[current].load = parseFloat(m2[2]);
          data[current].ops = parseInt(m2[3]);
          data[current].qs = parseInt(m2[4]);
        }
        const m3 = line.match(/^\s*stressors:\s*(.+)/);
        if (m3) {
          data[current].stressors = m3[1].trim();
        }
      }
    }

    for (const aid of AGENTS) {
      const d = data[aid];
      if (!d) continue;
      // Stat card
      document.getElementById('name-' + aid).textContent = d.name || '—';
      const loadEl = document.getElementById('load-' + aid);
      if (typeof d.load === 'number') {
        loadEl.textContent = d.load.toFixed(2);
        loadEl.className = 'stat-value ' + classifyLoad(d.load);
      }
      const info = document.getElementById('info-' + aid);
      const parts = [`${d.ops || 0} opinions`, `${d.qs || 0} questions`];
      if (d.stressors) parts.unshift(d.stressors.split(',')[0].trim());
      info.textContent = parts.join(' · ');
      // Pill
      const pill = document.getElementById('pill-' + aid);
      const status = d.status || '?';
      pill.textContent = status;
      pill.className = 'pill ' + (status === 'active' ? 'active' :
                                  status === 'suspended' ? 'suspended' : 'unknown');
      // Meta line in agent control
      const meta = document.getElementById('meta-' + aid);
      if (meta && typeof d.load === 'number') {
        meta.textContent = `· suffering ${d.load.toFixed(2)} · ${d.name}`;
      }
    }
  }

  async function pollHealth() {
    try {
      const up = await window.pywebview.api.check_health();
      statusEl.classList.toggle('up', up);
      statusEl.classList.toggle('down', !up);
      statusText.textContent = up ? 'daemon running' : 'daemon stopped';
    } catch (e) {
      statusEl.classList.add('down');
      statusText.textContent = 'unreachable';
    }
  }

  async function refreshAll() {
    await pollHealth();
    try {
      const result = await window.pywebview.api.status();
      updateStatsFromText(result);
    } catch (e) {}
  }

  window.addEventListener('pywebviewready', () => {
    log('panel ready', 'dim');
    refreshAll();
    setInterval(refreshAll, 5000);
  });
</script>
</body>
</html>
