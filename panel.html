<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hollow AgentOS</title>
<style>
  :root {
    --bg: #1c1c1e;
    --card: #2c2c2e;
    --card-hover: #353537;
    --border: #38383a;
    --border-strong: #48484a;
    --text: #ffffff;
    --text-secondary: #98989d;
    --text-tertiary: #636366;
    --accent: #0a84ff;
    --accent-hover: #0070d8;
    --success: #30d158;
    --danger: #ff453a;
    --danger-hover: #d93b32;
    --warning: #ff9f0a;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Segoe UI Variable", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
  }

  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 12px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 4px 8px;
  }
  header .title-block h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 2px;
  }
  header .title-block .subtitle {
    font-size: 11px;
    color: var(--text-tertiary);
  }
  header .status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  header .status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-tertiary);
    transition: background 200ms ease, box-shadow 200ms ease;
  }
  header .status.up .dot {
    background: var(--success);
    box-shadow: 0 0 6px rgba(48, 209, 88, 0.5);
  }
  header .status.down .dot {
    background: var(--danger);
  }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .card h2 {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .card .card-hint {
    font-size: 11px;
    color: var(--text-tertiary);
  }

  /* Buttons */
  .btn {
    padding: 6px 12px;
    background: #3a3a3c;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 100ms ease, border-color 100ms ease;
    user-select: none;
  }
  .btn:hover { background: #48484a; border-color: #5e5e60; }
  .btn:active { background: #2c2c2e; transform: translateY(0.5px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger {
    background: transparent;
    border-color: var(--danger);
    color: var(--danger);
    font-weight: 600;
  }
  .btn.danger:hover { background: var(--danger); color: white; }
  .btn.compact { padding: 4px 10px; font-size: 11px; }

  .button-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* Message section */
  .msg-input {
    width: 100%;
    background: #1c1c1e;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    min-height: 60px;
    margin-bottom: 8px;
    outline: none;
    transition: border-color 100ms ease;
  }
  .msg-input:focus { border-color: var(--accent); }
  .msg-actions {
    display: flex;
    justify-content: flex-end;
  }

  /* Agent rows */
  .agent-grid {
    display: grid;
    gap: 6px;
  }
  .agent-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #1c1c1e;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .agent-row .agent-name {
    font-size: 12px;
    font-weight: 500;
  }
  .agent-row .agent-meta {
    font-size: 10px;
    color: var(--text-tertiary);
    margin-left: 6px;
  }

  /* Output log */
  .output-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .output-log {
    flex: 1;
    background: #1c1c1e;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: "SF Mono", "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--text);
    overflow-y: auto;
    white-space: pre-wrap;
    user-select: text;
  }
  .output-log .entry { margin-bottom: 8px; }
  .output-log .entry .ts { color: var(--text-tertiary); margin-right: 8px; }
  .output-log .entry.ok { }
  .output-log .entry.err { color: #ff8a80; }
  .output-log .entry.dim { color: var(--text-secondary); }

  .clear-btn {
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    font-size: 11px;
    cursor: pointer;
    padding: 2px 6px;
  }
  .clear-btn:hover { color: var(--text); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #48484a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #5e5e60; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-block">
      <h1>Hollow AgentOS</h1>
      <div class="subtitle">control panel</div>
    </div>
    <div id="status" class="status">
      <div class="dot"></div>
      <div class="status-text">checking…</div>
    </div>
  </header>

  <div class="card">
    <div class="card-header">
      <h2>System</h2>
    </div>
    <div class="button-row">
      <button class="btn" onclick="op('start')">Start</button>
      <button class="btn" onclick="op('stop')">Stop</button>
      <button class="btn" onclick="op('status')">Status</button>
      <button class="btn" onclick="op('open_monitor')">Monitor</button>
      <button class="btn" onclick="op('open_workspace')">Workspace</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Send Message</h2>
      <span class="card-hint">delivered to all agents next cycle</span>
    </div>
    <textarea id="msg" class="msg-input" placeholder="Type a host message…"></textarea>
    <div class="msg-actions">
      <button class="btn primary" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Agents</h2>
      <button class="clear-btn" onclick="op('status')">refresh</button>
    </div>
    <div class="agent-grid" id="agent-grid">
      <div class="agent-row" data-agent="scout">
        <div><span class="agent-name">scout</span><span class="agent-meta" id="meta-scout">—</span></div>
        <button class="btn compact" onclick="opArg('suspend','scout')">Suspend</button>
        <button class="btn compact" onclick="opArg('resume','scout')">Resume</button>
      </div>
      <div class="agent-row" data-agent="analyst">
        <div><span class="agent-name">analyst</span><span class="agent-meta" id="meta-analyst">—</span></div>
        <button class="btn compact" onclick="opArg('suspend','analyst')">Suspend</button>
        <button class="btn compact" onclick="opArg('resume','analyst')">Resume</button>
      </div>
      <div class="agent-row" data-agent="builder">
        <div><span class="agent-name">builder</span><span class="agent-meta" id="meta-builder">—</span></div>
        <button class="btn compact" onclick="opArg('suspend','builder')">Suspend</button>
        <button class="btn compact" onclick="opArg('resume','builder')">Resume</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Destructive</h2>
      <span class="card-hint">stop the daemon first</span>
    </div>
    <div class="button-row">
      <button class="btn danger" onclick="confirmNuke()">Nuclear Reset</button>
    </div>
  </div>

  <div class="card output-card">
    <div class="card-header">
      <h2>Output</h2>
      <button class="clear-btn" onclick="clearOutput()">clear</button>
    </div>
    <div id="output" class="output-log"></div>
  </div>
</div>

<script>
  const output = document.getElementById('output');
  const statusEl = document.getElementById('status');
  const statusText = statusEl.querySelector('.status-text');

  function ts() {
    const d = new Date();
    return d.toLocaleTimeString('en-US', { hour12: false });
  }

  function log(text, cls = 'ok') {
    const e = document.createElement('div');
    e.className = 'entry ' + cls;
    const tsSpan = document.createElement('span');
    tsSpan.className = 'ts';
    tsSpan.textContent = ts();
    e.appendChild(tsSpan);
    const txt = document.createElement('span');
    txt.textContent = text;
    e.appendChild(txt);
    output.appendChild(e);
    output.scrollTop = output.scrollHeight;
  }

  function clearOutput() { output.innerHTML = ''; }

  async function op(name) {
    try {
      const result = await window.pywebview.api[name]();
      log(result, 'ok');
      if (name === 'status') updateAgentMeta(result);
    } catch (e) {
      log('error: ' + e, 'err');
    }
  }

  async function opArg(name, arg) {
    try {
      const result = await window.pywebview.api[name](arg);
      log(result, 'ok');
    } catch (e) {
      log('error: ' + e, 'err');
    }
  }

  async function sendMessage() {
    const ta = document.getElementById('msg');
    const text = ta.value.trim();
    if (!text) { log('empty message — nothing sent', 'dim'); return; }
    try {
      const result = await window.pywebview.api.send_message(text);
      log(result, 'ok');
      ta.value = '';
    } catch (e) {
      log('error: ' + e, 'err');
    }
  }

  async function confirmNuke() {
    const ok = await window.pywebview.api.confirm_dialog(
      'Nuclear Reset',
      'Wipe workspace, dynamic tools, profiles, suffering, and goals?\n\nNames will be preserved. Stop the daemon first if running.'
    );
    if (!ok) { log('nuke cancelled', 'dim'); return; }
    log('running nuclear reset…', 'dim');
    try {
      const result = await window.pywebview.api.nuke();
      log(result, 'ok');
    } catch (e) {
      log('error: ' + e, 'err');
    }
  }

  function updateAgentMeta(statusText) {
    // Parse status output to extract per-agent meta info
    const lines = statusText.split('\n');
    let current = null;
    for (const line of lines) {
      const m = line.match(/^(scout|analyst|builder)\s*\(([^)]+)\):/);
      if (m) { current = m[1]; continue; }
      if (current && line.includes('suffering=')) {
        const meta = line.trim().replace(/^\s+/, '');
        const el = document.getElementById('meta-' + current);
        if (el) el.textContent = '· ' + meta;
        current = null;
      }
    }
  }

  async function pollHealth() {
    try {
      const up = await window.pywebview.api.check_health();
      statusEl.classList.toggle('up', up);
      statusEl.classList.toggle('down', !up);
      statusText.textContent = up ? 'daemon running' : 'daemon stopped';
    } catch (e) {
      statusEl.classList.add('down');
      statusText.textContent = 'unreachable';
    }
  }

  // Wait for pywebview to be ready, then start polling
  window.addEventListener('pywebviewready', () => {
    log('panel ready', 'dim');
    pollHealth();
    setInterval(pollHealth, 5000);
    setTimeout(() => op('status'), 300);
  });
</script>
</body>
</html>
